server {
    listen 80;
    server_name xinghuanhai.com api.xinghuanhai.com;
    # HTTP 强制跳 HTTPS
    return 301 https://$host$request_uri;
}

# 裸域名证书不覆盖 apex，跳到 api（api 已有 DNS 且同时承载官网静态页与后端）
server {
    listen 443 ssl http2;
    server_name xinghuanhai.com;

    ssl_certificate     /etc/letsencrypt/live/xinghuanhai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xinghuanhai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://api.xinghuanhai.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.xinghuanhai.com api.xinghuanhai.com;

    ssl_certificate     /etc/letsencrypt/live/xinghuanhai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xinghuanhai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/xinghuanhai;
    index index.html;

    # 静态官网优先，找不到的请求代理到后端 API
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20M;
    }

    # 管理后台 /admin/*（2026-08-23）：走 Express 单一来源，避免被下方静态资源正则
    # location 拦截成 404（admin.js/css 不在 /var/www/xinghuanhai 磁盘目录）
    # ^~ 前缀匹配优先级高于正则 location
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 微信/平台域名归属校验文件通道（check.txt 放 /var/www/xinghuanhai/）
    location ~ ^/[A-Za-z0-9_.-]+\.txt$ {
        root /var/www/xinghuanhai;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript text/html image/svg+xml;
    gzip_min_length 1000;
}
