<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <title>Preflight</title>
    <style id="theme-vars">
/* ============================================
   星寰海 · 星海梦境主题 (Starry Ocean Dream)
   深蓝星河 + 暖金星光 + Q版圆润
   ============================================ */

:root {
  /* ---- 基础语义色 ---- */
  --xhh-background: #0B1426;
  --xhh-foreground: #EDF1F8;

  --xhh-card: #13203A;
  --xhh-card-foreground: #EDF1F8;

  --xhh-popover: #182C4A;
  --xhh-popover-foreground: #EDF1F8;

  --xhh-primary: #F5C451;
  --xhh-primary-foreground: #1A1408;

  --xhh-muted: #182C4A;
  --xhh-muted-foreground: #8E9DB8;

  --xhh-border: #213152;
  --xhh-input: #213152;
  --xhh-ring: #F5C451;

  /* ---- 圆角（Q版圆润风格，用户明确要求可爱圆润） ---- */
  --xhh-radius-sm: 10px;
  --xhh-radius-md: 18px;
  --xhh-radius-lg: 28px;

  /* ---- 深度层次 ---- */
  --xhh-surface-1: #0F1A30;
  --xhh-surface-2: #13203A;
  --xhh-surface-3: #182C4A;

  /* ---- 文字层次 ---- */
  --xhh-ink: #EDF1F8;
  --xhh-ink-2: #B0BDD4;
  --xhh-ink-3: #6E7D99;

  /* ---- 品牌金色层次 ---- */
  --xhh-gold: #F5C451;
  --xhh-gold-soft: #F8D680;
  --xhh-gold-deep: #D9A938;

  /* ---- 字体系统 ---- */
  --xhh-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --xhh-font-display: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

  /* ---- 间距（8pt 栅格） ---- */
  --xhh-space-1: 4px;
  --xhh-space-2: 8px;
  --xhh-space-3: 12px;
  --xhh-space-4: 16px;
  --xhh-space-5: 24px;
  --xhh-space-6: 32px;
  --xhh-space-7: 48px;
  --xhh-space-8: 80px;

  /* ---- 阴影 ---- */
  --xhh-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.08);
  --xhh-shadow-2: 0 8px 28px -8px rgba(0, 0, 0, 0.4);
  --xhh-shadow-glow: 0 0 40px rgba(245, 196, 81, 0.12);
}

/* ---- 暗色模式微调 ---- */
.dark {
  --xhh-background: #0B1426;
  --xhh-foreground: #EDF1F8;
  --xhh-card: #13203A;
  --xhh-card-foreground: #EDF1F8;
  --xhh-border: #213152;
}

/* ---- 全局字体 ---- */
body {
  font-family: var(--xhh-font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- 标题排版 ---- */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--xhh-font-display);
  text-wrap: balance;
  word-break: keep-all;
}

/* ---- 数字等宽 ---- */
.tabular-nums {
  font-variant-numeric: tabular-nums;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--xhh-background);
    --color-foreground: var(--xhh-foreground);
    --color-card: var(--xhh-card);
    --color-card-foreground: var(--xhh-card-foreground);
    --color-popover: var(--xhh-popover);
    --color-popover-foreground: var(--xhh-popover-foreground);
    --color-primary: var(--xhh-primary);
    --color-primary-foreground: var(--xhh-primary-foreground);
    --color-muted: var(--xhh-muted);
    --color-muted-foreground: var(--xhh-muted-foreground);
    --color-border: var(--xhh-border);
    --color-input: var(--xhh-input);
    --color-ring: var(--xhh-ring);
    --radius-sm: var(--xhh-radius-sm);
    --radius-md: var(--xhh-radius-md);
    --radius-lg: var(--xhh-radius-lg);
  }
  @layer base {
    body { background: var(--xhh-background); color: var(--xhh-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
