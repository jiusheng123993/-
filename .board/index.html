<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目看板 - 星寰海</title>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--text:#e2e8f0;--dim:#94a3b8;--muted:#64748b;--accent:#38bdf8;--accent2:#818cf8;--green:#4ade80;--green-bg:rgba(74,222,128,.1);--yellow:#fbbf24;--yellow-bg:rgba(251,191,36,.1);--red:#f87171;--red-bg:rgba(248,113,113,.1);--blue:#60a5fa;--blue-bg:rgba(96,165,250,.1);--pink:#f472b6;--pink-bg:rgba(244,114,182,.1);--gray:#94a3b8;--gray-bg:rgba(148,163,184,.1);--border:#334155;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.layout{display:flex;min-height:100vh}
.sb{width:240px;background:var(--bg);border-right:1px solid var(--border);flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.sb-hd{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sb-logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.sb-pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto}
.sb-lbl{padding:8px 16px 4px;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600}
.sb-item{padding:8px 16px 8px 24px;font-size:13px;cursor:pointer;color:var(--dim);transition:.15s;border-left:3px solid transparent;display:flex;align-items:center;gap:8px}
.sb-item:hover{background:rgba(255,255,255,.03);color:var(--text)}
.sb-item.on{background:rgba(56,189,248,.08);color:var(--accent);border-left-color:var(--accent)}
.sb-item .ic{font-size:14px;width:18px;text-align:center}
.sb-date{padding:6px 16px 6px 32px;font-size:12px;cursor:pointer;color:var(--muted);transition:.15s;display:flex;align-items:center;justify-content:space-between}
.sb-date:hover{color:var(--dim);background:rgba(255,255,255,.02)}
.sb-date.on{color:var(--accent)}
.sb-date .ct{font-size:10px;background:var(--border);padding:1px 6px;border-radius:8px}
.sb-ft{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.ws-d{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
.ws-d.on{background:var(--green)}.ws-d.off{background:var(--red)}
.main{flex:1;padding:24px 32px;max-width:1100px;min-width:0}
.hdr{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--border);border-radius:14px;padding:28px 32px;margin-bottom:20px;position:relative;overflow:hidden}
.hdr::before{content:'';position:absolute;top:-50%;right:-20%;width:300px;height:300px;background:radial-gradient(circle,rgba(56,189,248,.08) 0%,transparent 70%);pointer-events:none}
.hdr h1{font-size:22px;font-weight:700;margin-bottom:4px;position:relative}
.hdr .meta{font-size:13px;color:var(--dim);position:relative;display:flex;flex-wrap:wrap;gap:16px}
.hdr .mi{display:flex;align-items:center;gap:4px}
.hdr .ps{margin-top:16px;position:relative}
.hdr .pb{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.hdr .pf{height:100%;border-radius:4px;transition:width .8s;background:linear-gradient(90deg,var(--accent),var(--green))}
.hdr .pl{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--dim)}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center;transition:transform .15s}
.sc:hover{transform:translateY(-2px)}
.sv{font-size:28px;font-weight:700}
.sv.g{color:var(--green)}.sv.y{color:var(--yellow)}.sv.b{color:var(--blue)}.sv.r{color:var(--red)}
.sl{font-size:12px;color:var(--muted);margin-top:2px}
.cd{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;margin-bottom:14px}
.ct2{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.mi2{padding:12px 0;border-bottom:1px solid var(--border)}
.mi2:last-child{border-bottom:none}
.mr{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.mr:hover .mn{color:var(--accent)}
.mn{font-size:14px;font-weight:500;transition:.15s}
.md{font-size:12px;color:var(--muted);margin-top:2px}
.mrt{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mp{width:80px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.mpf{height:100%;border-radius:2px;transition:width .5s}
.mpf.done{background:var(--green)}.mpf.doing{background:var(--yellow)}.mpf.pending{background:var(--gray)}.mpf.blocked{background:var(--red)}
.mdt{display:none;padding:10px 0 4px 16px}
.mdt.open{display:block}
.mst{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;color:var(--dim)}
.ck{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.ck.done{background:var(--green);border-color:var(--green);color:var(--bg)}
.ck.doing{background:var(--yellow);border-color:var(--yellow);color:var(--bg)}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.b-done{background:var(--green-bg);color:var(--green)}.b-doing{background:var(--yellow-bg);color:var(--yellow)}.b-pending{background:var(--gray-bg);color:var(--gray)}.b-fail{background:var(--red-bg);color:var(--red)}.b-review{background:var(--blue-bg);color:var(--blue)}.b-blocked{background:var(--pink-bg);color:var(--pink)}.b-change{background:var(--blue-bg);color:var(--blue)}.b-sync{background:rgba(129,140,248,.1);color:var(--accent2)}.b-test{background:var(--pink-bg);color:var(--pink)}
.sbx{margin-bottom:16px;position:relative}
.si{width:100%;padding:10px 14px 10px 36px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
.si:focus{border-color:var(--accent)}
.sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.fb{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.fbtn{padding:4px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);transition:.15s}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.on{background:rgba(56,189,248,.1);border-color:var(--accent);color:var(--accent)}
.dg{margin-bottom:20px}
.dh{font-size:13px;font-weight:600;color:var(--dim);padding:8px 0 8px 20px;border-bottom:1px solid var(--border);margin-bottom:8px;position:sticky;top:0;background:var(--bg2);z-index:1;display:flex;align-items:center;gap:8px}
.dh .dd{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.ti{position:relative;padding:10px 0 10px 28px;border-bottom:1px solid rgba(51,65,85,.5);transition:background .15s}
.ti:hover{background:rgba(255,255,255,.02)}
.ti:last-child{border-bottom:none}
.ti::before{content:'';position:absolute;left:6px;top:18px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg2)}
.ti.t-change::before{background:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.ti.t-done::before{background:var(--green);box-shadow:0 0 0 2px var(--green)}
.ti.t-fail::before{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.ti.t-review::before{background:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.ti.t-sync::before{background:var(--accent2);box-shadow:0 0 0 2px var(--accent2)}
.ti.t-test::before{background:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.tt{font-size:11px;color:var(--muted)}
.ttl{font-size:14px;font-weight:500;margin:2px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tde{font-size:13px;color:var(--dim);line-height:1.5}
.tf{font-size:12px;color:var(--accent);font-family:'SFMono-Regular',Consolas,monospace;margin-top:4px}
.ta{margin-top:6px}
.tvd{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline;display:inline-flex;align-items:center;gap:4px}
.tvd:hover{color:var(--blue)}
.ttb{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
.rv{padding:12px;border-radius:8px;margin-bottom:8px;border-left:3px solid}
.rv-pass{border-left-color:var(--green);background:var(--green-bg)}
.rv-fail{border-left-color:var(--red);background:var(--red-bg)}
.rv-info{border-left-color:var(--blue);background:var(--blue-bg)}
.rv-t{font-size:13px;font-weight:600;margin-bottom:4px}
.rv-d{font-size:12px;color:var(--dim)}
.rv-m{font-size:11px;color:var(--muted);margin-top:4px}
.tst{padding:10px 12px;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.02);border:1px solid var(--border)}
.tst-l{display:flex;align-items:center;gap:8px}
.tst-n{font-size:13px}
.tst-r{font-size:12px;color:var(--muted)}
.tst-d{font-size:11px;color:var(--muted)}
.dci{padding:10px 12px;border-radius:8px;margin-bottom:6px;background:rgba(255,255,255,.02);border:1px solid var(--border)}
.dci-t{font-size:13px;font-weight:500}
.dci-m{font-size:11px;color:var(--muted);margin-top:4px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-i{font-size:32px;margin-bottom:8px}
.empty-t{font-size:14px}
.hidden{display:none!important}
.dmo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none}
.dmo.on{opacity:1;pointer-events:auto}
.dm{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:95%;max-width:1400px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:translateY(20px);transition:transform .2s}
.dmo.on .dm{transform:translateY(0)}
.dm-h{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
.dm-t{font-size:14px;font-weight:600}
.dm-c{width:30px;height:30px;border:none;background:var(--border);border-radius:6px;cursor:pointer;font-size:16px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.dm-c:hover{background:var(--bg3);color:var(--text)}
.dm-b{flex:1;overflow:auto;padding:20px}
.dl{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.de{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.dpt{padding:16px;background:var(--bg);border-radius:8px;font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;line-height:1.7}
.dpl{padding:2px 0;color:var(--dim);border-bottom:1px solid var(--border)}
.dpl:last-child{border-bottom:none}
.dpc{padding:4px 0;color:var(--yellow);font-weight:600;border-bottom:1px solid rgba(251,191,36,.2);background:var(--yellow-bg);margin:2px -16px;padding-left:16px;padding-right:16px}
.dfc{background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.ddesc{padding:12px 16px;background:var(--yellow-bg);border-bottom:1px solid rgba(251,191,36,.2)}
.ddesc-l{font-size:13px;color:var(--yellow);line-height:1.7}
.ddesc-l:first-child{font-weight:600}
.dfh{padding:10px 16px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
.dfn{font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;color:var(--accent);font-weight:600}
.dfd{font-size:12px;color:var(--muted);margin-top:2px}
.dhs{display:flex;flex-direction:column}
.dhh{padding:6px 16px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.02);border-bottom:1px solid var(--border);font-family:'SFMono-Regular',Consolas,monospace}
.dp2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border)}
.dp2h{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}
.dp2hl{padding:6px 12px;font-size:11px;font-weight:600;background:var(--red-bg);color:var(--red);border-bottom:1px solid rgba(248,113,113,.2);border-right:1px solid var(--border)}
.dp2hr{padding:6px 12px;font-size:11px;font-weight:600;background:var(--green-bg);color:var(--green);border-bottom:1px solid rgba(74,222,128,.2)}
.ds{font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;line-height:1.6;overflow-x:auto}
.dsl{border-right:1px solid var(--border)}
.dlr{display:flex;white-space:pre}
.dln{width:40px;min-width:40px;text-align:right;padding:2px 6px;font-size:11px;user-select:none;border-right:1px solid var(--border);color:var(--muted)}
.dlc{padding:2px 8px;flex:1}
.dlr.del{background:var(--red-bg)}.dlr.del .dln{background:rgba(248,113,113,.15);color:var(--red)}.dlr.del .dlc{color:var(--red)}
.dlr.add{background:var(--green-bg)}.dlr.add .dln{background:rgba(74,222,128,.15);color:var(--green)}.dlr.add .dlc{color:var(--green)}
.dlr.ctx{background:rgba(255,255,255,.01)}.dlr.ctx .dln{color:var(--muted)}.dlr.ctx .dlc{color:var(--dim)}
.dlr.empty{background:transparent}.dlr.empty .dln{color:var(--border)}.dlr.empty .dlc{color:var(--border)}
.ra{padding:12px;border-radius:8px;margin-bottom:8px;background:rgba(255,255,255,.02);border:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;transition:background .15s}
.ra:hover{background:rgba(255,255,255,.04)}
.ra-ic{font-size:16px;flex-shrink:0;margin-top:2px}
.ra-bd{flex:1;min-width:0}
.ra-t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra-d{font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra-tm{font-size:11px;color:var(--muted);flex-shrink:0;margin-top:2px}
.rv-dim{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rv-di{padding:6px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px}
.rv-di.pass{background:rgba(74,222,128,.08);color:var(--green)}
.rv-di.fail{background:rgba(248,113,113,.08);color:var(--red)}
.rv-di.warn{background:rgba(251,191,36,.08);color:var(--yellow)}
.mg{margin-bottom:16px}
.mg-h{font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.mg-h .mg-ct{font-size:10px;background:var(--border);padding:1px 6px;border-radius:8px}
.tl-stat{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:12px}
.tl-stat strong{color:var(--accent)}
.tc{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px}
.tc canvas{width:100%;height:120px;display:block}
.tc-legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--dim)}
.tc-legend span{display:flex;align-items:center;gap:4px}
.tc-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
@media(max-width:900px){.sb{width:180px}.main{padding:16px}.sg{grid-template-columns:repeat(2,1fr)}.dm{width:96%}.dp2{grid-template-columns:1fr}.dsl{border-right:none;border-bottom:1px solid var(--border)}.rv-dim{grid-template-columns:1fr}}
@media(max-width:600px){.sb{display:none}.sg{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="layout">
<div class="sb">
<div class="sb-hd"><div class="sb-logo"><span class="sb-pulse"></span> 星寰海</div></div>
<div class="sb-nav">
<div><div class="sb-lbl">概览</div><div class="sb-item on" data-v="overview"><span class="ic">📊</span>仪表盘</div><div class="sb-item" data-v="modules"><span class="ic">📦</span>模块看板</div></div>
<div><div class="sb-lbl">历史记录</div><div class="sb-item" data-v="timeline"><span class="ic">🕐</span>时间线</div><div class="sb-item" data-v="reviews"><span class="ic">🔍</span>审查记录</div><div class="sb-item" data-v="tests"><span class="ic">🧪</span>测试记录</div><div class="sb-item" data-v="decisions"><span class="ic">💡</span>决策记录</div></div>
<div id="date-index"><div class="sb-lbl">按日期查找</div></div>
</div>
<div class="sb-ft"><span class="ws-d off" id="ws-dot"></span><span id="ws-text">实时更新未连接</span></div>
</div>
<div class="main">
<div class="hdr"><h1>星寰海 — 情绪健康管理平台</h1><div class="meta"><span class="mi">📌 当前阶段：<strong id="h-stage">MVP开发</strong></span><span class="mi">🌿 分支：<strong id="h-branch">develop</strong></span><span class="mi">🕐 更新于：<strong id="h-time">-</strong></span></div><div class="ps"><div class="pb"><div class="pf" id="h-bar" style="width:0%"></div></div><div class="pl"><span>整体进度</span><span id="h-pct">0%</span></div></div></div>
<div id="v-overview"></div>
<div id="v-modules" class="hidden"></div>
<div id="v-timeline" class="hidden"></div>
<div id="v-reviews" class="hidden"></div>
<div id="v-tests" class="hidden"></div>
<div id="v-decisions" class="hidden"></div>
</div>
</div>

function rTests(){var h='<div class="cd"><div class="ct2">🧪 测试记录</div><div style="margin-bottom:12px;font-size:12px;color:var(--muted)">测试框架：Vitest | 命令：npm run test</div>';var tc=BD.tests.filter(function(t){return t.count>0});if(tc.length>=3){h+='<div class="tc"><canvas id="test-chart"></canvas><div class="tc-legend"><span><span class="dot" style="background:var(--green)"></span>通过数</span><span><span class="dot" style="background:var(--accent)"></span>总测试数</span></div></div>'}if(BD.tests.length===0){h+='<div class="empty"><div class="empty-i">🧪</div><div class="empty-t">暂无测试记录</div></div>'}else{BD.tests.forEach(function(t){var ic=t.pass?"✅":"❌";h+='<div class="tst"><div class="tst-l"><span>'+ic+'</span><span class="tst-n">'+esc(t.name)+'</span></div><div><span class="tst-r">'+esc(t.result)+'</span><span class="tst-d" style="margin-left:12px">'+esc(t.date)+'</span></div></div>'})}h+="</div>";document.getElementById("v-tests").innerHTML=h;if(tc.length>=3){setTimeout(drawTestChart,50)}}

function drawTestChart(){var cv=document.getElementById("test-chart");if(!cv)return;var ctx=cv.getContext("2d");var dpr=window.devicePixelRatio||1;var w=cv.offsetWidth;var h=120;cv.width=w*dpr;cv.height=h*dpr;ctx.scale(dpr,dpr);var tc=BD.tests.filter(function(t){return t.count>0});if(tc.length===0)return;var mx=Math.max.apply(null,tc.map(function(t){return t.total}));mx=Math.max(mx,10);var pad={t:10,b:20,l:40,r:10};var cw=w-pad.l-pad.r;var ch=h-pad.t-pad.b;ctx.strokeStyle="var(--border)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,h-pad.b);ctx.lineTo(w-pad.r,h-pad.b);ctx.stroke();ctx.fillStyle="var(--muted)";ctx.font="10px sans-serif";ctx.textAlign="right";for(var i=0;i<=4;i++){var y=pad.t+ch*(1-i/4);ctx.fillText(Math.round(mx*i/4),pad.l-4,y+3);ctx.strokeStyle="rgba(51,65,85,.3)";ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke()}var bw=Math.min(20,(cw/tc.length)*0.6);var gap=cw/tc.length;tc.forEach(function(t,idx){var x=pad.l+gap*idx+gap/2;var th=ch*(t.total/mx);var ph=ch*(t.count/mx);ctx.fillStyle="rgba(56,189,248,0.3)";ctx.fillRect(x-bw/2,h-pad.b-th,bw,th);ctx.fillStyle="rgba(74,222,128,0.8)";ctx.fillRect(x-bw/2,h-pad.b-ph,bw,ph);ctx.fillStyle="var(--muted)";ctx.font="9px sans-serif";ctx.textAlign="center";var lb=t.date.substring(5);ctx.fillText(lb,x,h-pad.b+12)})}

function rDecisions(){var h='<div class="cd"><div class="ct2">💡 决策记录</div>';if(BD.decisions.length===0){h+='<div class="empty"><div class="empty-i">💡</div><div class="empty-t">暂无决策记录</div></div>'}else{BD.decisions.forEach(function(d){h+='<div class="dci"><div class="dci-t">→ '+esc(d.title)+'</div><div class="dci-m">'+esc(d.detail)+" | "+esc(d.date)+"</div></div>"})}h+="</div>";document.getElementById("v-decisions").innerHTML=h}

function rDateIdx(){var ct=document.getElementById("date-index");var dc={};BD.timeline.forEach(function(t){var dm=t.time.match(/^(\d{4}-\d{2}-\d{2})/);if(dm){var dt=dm[1];dc[dt]=(dc[dt]||0)+1}});var sd=Object.keys(dc).sort(function(a,b){return b.localeCompare(a)});var al=document.createElement("div");al.className="sb-date on";al.textContent="全部显示";al.onclick=function(){document.querySelectorAll(".sb-date").forEach(function(e){e.classList.remove("on")});this.classList.add("on");_df="";swV("timeline")};ct.appendChild(al);sd.forEach(function(dt){var cn=dc[dt];var ps=dt.split("-");var mo=parseInt(ps[1],10);var dy=parseInt(ps[2],10);var el=document.createElement("div");el.className="sb-date";el.innerHTML=mo+"月"+dy+'日 <span class="ct">'+cn+"</span>";el.dataset.date=dt;el.onclick=function(){document.querySelectorAll(".sb-date").forEach(function(e){e.classList.remove("on")});this.classList.add("on");_df=dt;swV("timeline")};ct.appendChild(el)})}

function swV(nm){document.querySelectorAll(".sb-item").forEach(function(e){e.classList.remove("on")});document.querySelectorAll('[id^="v-"]').forEach(function(e){e.classList.add("hidden")});var it=document.querySelector('.sb-item[data-v="'+nm+'"]');if(it)it.classList.add("on");var vw=document.getElementById("v-"+nm);if(vw)vw.classList.remove("hidden");if(nm==="overview")rOverview();else if(nm==="modules")rModules();else if(nm==="timeline")rTimeline();else if(nm==="reviews")rReviews();else if(nm==="tests")rTests();else if(nm==="decisions")rDecisions()}

document.querySelectorAll(".sb-item").forEach(function(el){el.addEventListener("click",function(){var v=this.dataset.v;if(v)swV(v)})});

function openDiff(fn,tl){var md=document.getElementById("diff-modal");var bd=document.getElementById("dm-body");var te=document.getElementById("dm-title");te.textContent=tl?"改动详情 - "+tl:"改动详情";te.dataset.filename=fn;bd.innerHTML='<div class="dl">加载中...</div>';md.classList.add("on");document.body.style.overflow="hidden";fetch("diffs/"+fn).then(function(r){if(!r.ok)throw new Error("文件不存在");return r.text()}).then(function(tx){bd.innerHTML=renderDiff(tx)}).catch(function(er){bd.innerHTML='<div class="de">暂无 diff 记录（'+er.message+"）</div>"})}
function closeDiff(){var md=document.getElementById("diff-modal");md.classList.remove("on");document.body.style.overflow=""}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDiff()});

function genFileDesc(fn,ha,hd){var ex=fn.split(".").pop()||"";var bs=fn.split("/").pop()||fn;if(bs.indexOf(".test.")>=0||bs.indexOf(".spec.")>=0)return"增加/修改测试用例";if(ex==="css"||ex==="scss"||ex==="less")return"调整样式";if(ex==="ts"||ex==="tsx"||ex==="js"||ex==="jsx"){if(ha&&!hd)return"新增功能";if(!ha&&hd)return"删除/重构代码";return"修改逻辑代码"}if(ex==="html")return"调整页面结构";if(ex==="json")return"更新配置";if(ex==="md"||ex==="txt")return"更新文档";if(ha&&!hd)return"新增内容";if(!ha&&hd)return"删除内容";return"修改内容"}

function parseDiff(tx){var files=[];var lines=tx.split("\n");var cf=null,ch=null,desc=[],inDesc=false;for(var li=0;li<lines.length;li++){var ln=lines[li];if(ln.indexOf("# 改动说明")===0){inDesc=true;continue}if(inDesc&&ln.indexOf("#")===0){desc.push(ln.substring(1).trim());continue}if(inDesc&&ln.trim()!==""&&ln.indexOf("#")!==0){inDesc=false}if(ln.indexOf("diff --git")===0){if(cf){cf.description=desc;files.push(cf)}var mt=ln.match(/diff --git a\/(.+) b\/(.+)/);cf={filename:mt?mt[1]:ln,hunks:[],description:[]};ch=null;desc=[]}else if(ln.indexOf("@@")===0){var m=ln.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);ch={header:ln,oldStart:m?parseInt(m[1],10):0,newStart:m?parseInt(m[2],10):0,lines:[]};if(cf)cf.hunks.push(ch)}else if(ch){if(ln.indexOf("-")===0)ch.lines.push({type:"del",content:ln.substring(1)});else if(ln.indexOf("+")===0)ch.lines.push({type:"add",content:ln.substring(1)});else if(ln.indexOf(" ")===0)ch.lines.push({type:"ctx",content:ln.substring(1)});else if(ln==="")ch.lines.push({type:"ctx",content:""})}}if(cf){cf.description=desc;files.push(cf)}return files}

function renderDiff(tx){var files=parseDiff(tx);if(files.length===0){var lines=tx.split("\n").filter(function(l){return l.trim()});if(lines.length===0)return'<div class="de">暂无 diff 内容</div>';var h='<div class="dpt">';lines.forEach(function(ln){if(ln.indexOf("#")===0)h+='<div class="dpc">'+esc(ln.substring(1).trim())+"</div>";else h+='<div class="dpl">'+esc(ln)+"</div>"});return h+"</div>"}var h="";files.forEach(function(file){var ha=file.hunks.some(function(hk){return hk.lines.some(function(l){return l.type==="add"})});var hd=file.hunks.some(function(hk){return hk.lines.some(function(l){return l.type==="del"})});var ds=genFileDesc(file.filename,ha,hd);h+='<div class="dfc"><div class="dfh"><div class="dfn">📄 '+esc(file.filename)+'</div><div class="dfd">'+esc(ds)+"</div></div>";if(file.description&&file.description.length){h+='<div class="ddesc">';file.description.forEach(function(dl){h+='<div class="ddesc-l">'+esc(dl)+"</div>"});h+="</div>"}h+='<div class="dhs">';file.hunks.forEach(function(hk){h+='<div class="dhh">'+esc(hk.header)+"</div>";var pairs=[];var i=0;var ls=hk.lines;while(i<ls.length){if(ls[i].type==="del"){var dels=[];while(i<ls.length&&ls[i].type==="del"){dels.push(ls[i]);i++}var adds=[];while(i<ls.length&&ls[i].type==="add"){adds.push(ls[i]);i++}var mx=Math.max(dels.length,adds.length);for(var j=0;j<mx;j++){pairs.push({left:j<dels.length?dels[j]:null,right:j<adds.length?adds[j]:null})}}else if(ls[i].type==="add"){pairs.push({left:null,right:ls[i]});i++}else{pairs.push({left:ls[i],right:ls[i]});i++}}h+='<div class="dp2"><div class="dp2h"><div class="dp2hl">❌ 修改前</div><div class="dp2hr">✅ 修改后</div></div>';var ol=hk.oldStart,nl=hk.newStart;var ll=[],rl=[];pairs.forEach(function(p){if(p.left&&p.left.type==="ctx"){ll.push({type:"ctx",content:p.left.content,num:ol});rl.push({type:"ctx",content:p.right.content,num:nl});ol++;nl++}else{if(p.left){ll.push({type:"del",content:p.left.content,num:ol});ol++}else{ll.push({type:"empty",content:"",num:""})}if(p.right){rl.push({type:"add",content:p.right.content,num:nl});nl++}else{rl.push({type:"empty",content:"",num:""})}}});h+='<div class="ds dsl">';ll.forEach(function(ln){h+='<div class="dlr '+ln.type+'"><div class="dln">'+(ln.num!==""?ln.num:"")+'</div><div class="dlc">'+esc(ln.content)+"</div></div>"});h+="</div>";h+='<div class="ds">';rl.forEach(function(ln){h+='<div class="dlr '+ln.type+'"><div class="dln">'+(ln.num!==""?ln.num:"")+'</div><div class="dlc">'+esc(ln.content)+"</div></div>"});h+="</div></div>"});h+="</div></div>"});return h}

(function initWS(){var ws,rt,delay=1000,attempt=0;function us(c,t){var d=document.getElementById("ws-dot");var x=document.getElementById("ws-text");if(d)d.className="ws-d "+(c?"on":"off");if(x)x.textContent=t}function conn(){try{ws=new WebSocket("ws://localhost:8081");ws.onopen=function(){us(true,"实时更新已连接");delay=1000;attempt=0;if(rt){clearTimeout(rt);rt=null}};ws.onmessage=function(ev){try{var d=JSON.parse(ev.data);if(d.type==="reload"){if(d.file&&d.file.indexOf("index.html")>=0)location.reload();if(d.file&&d.file.indexOf(".diff")>=0){var md=document.getElementById("diff-modal");if(md&&md.classList.contains("on")){var te=document.getElementById("dm-title");var cf=te?te.dataset.filename:null;if(cf&&d.file.indexOf(cf)>=0){var tt=te.textContent.replace("改动详情 - ","");openDiff(cf,tt)}}}}}catch(e){}};ws.onclose=function(){us(false,"实时更新未连接 ("+Math.round(delay/1000)+"秒后重试)");attempt++;delay=Math.min(delay*2,16000);rt=setTimeout(conn,delay)};ws.onerror=function(){us(false,"实时更新连接错误")}}catch(e){us(false,"实时更新初始化失败");rt=setTimeout(conn,delay)}}conn()})();

rHdr();rOverview();rDateIdx();
