<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星河宠记 · 知识图谱审核后台</title>
  <!-- 外置 CSS/JS：helmet 默认 CSP(script-src 'self') 禁止内联脚本与内联事件，管理页必须外置（审查项 S1 修复）
       ?v= 版本号强制刷新浏览器缓存（改 admin.js/css 后记得递增） -->
  <link rel="stylesheet" href="/admin/admin.css?v=3" />
</head>
<body>
  <div class="wrap">
    <h1>🐾 星河宠记 · 知识图谱审核后台</h1>

    <div class="card">
      <label>管理员令牌（x-admin-token，存于浏览器本地）</label>
      <input type="text" id="token" placeholder="输入 ADMIN_TOKEN" />
      <button id="btn-save-token">保存令牌</button>
      <button id="btn-test" class="secondary">测试连接</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="graph">① 图谱查看/编辑</div>
      <div class="tab" data-tab="feedback">② 纠错反馈</div>
      <div class="tab" data-tab="redeem">③ 兑换码</div>
    </div>

    <!-- Tab 1：图谱 -->
    <div id="panel-graph">
      <div class="card">
        <label>当前版本：<span id="graph-version">-</span></label>
        <label>图谱数据（JSON，保存后版本自动递增；对照权威源核查后再改）</label>
        <textarea id="graph-json" placeholder="加载中..."></textarea>
        <div class="row">
          <button id="btn-save-graph">保存图谱（版本 +1）</button>
          <button id="btn-reload" class="secondary">重新加载</button>
        </div>
      </div>
    </div>

    <!-- Tab 2：反馈 -->
    <div id="panel-feedback" class="hidden">
      <div class="card">
        <label>状态过滤</label>
        <select id="fb-status">
          <option value="">全部</option>
          <option value="open" selected>待审核</option>
          <option value="approved">已通过</option>
          <option value="rejected">已驳回</option>
        </select>
        <button id="btn-refresh" class="secondary">刷新</button>
        <div id="fb-list"></div>
      </div>
    </div>

    <!-- Tab 3：兑换码（2026-08-23） -->
    <div id="panel-redeem" class="hidden">
      <div class="card">
        <label>生成兑换码</label>
        <div class="redeem-form">
          <label>数量
            <input type="number" id="redeem-count" value="1" min="1" max="100" />
          </label>
          <label>会员天数
            <input type="number" id="redeem-days" value="30" min="1" max="36500" />
          </label>
          <label>备注
            <input type="text" id="redeem-note" placeholder="发给谁/用途" />
          </label>
        </div>
        <button id="btn-gen-codes">生成兑换码</button>
        <div id="redeem-result" class="redeem-result"></div>
      </div>
      <div class="card">
        <label>兑换码列表</label>
        <select id="redeem-status">
          <option value="">全部</option>
          <option value="unused" selected>未使用</option>
          <option value="used">已使用</option>
        </select>
        <button id="btn-refresh-codes" class="secondary">刷新</button>
        <div id="redeem-list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/admin/admin.js?v=3"></script>
</body>
</html>
