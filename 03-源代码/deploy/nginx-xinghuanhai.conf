# ============================================================
# 星寰海 - Nginx 配置 (xinghuanhai.com)
# 放置路径: /etc/nginx/sites-available/xinghuanhai
# 启用: ln -s /etc/nginx/sites-available/xinghuanhai /etc/nginx/sites-enabled/
# 测试: nginx -t
# 重载: systemctl reload nginx
# ============================================================

# 第一阶段：备案通过前 —— 只用 HTTP
# 第二阶段：备案通过后 —— 取消注释 HTTPS server 块，注释掉 HTTP 的 location / 块

server {
    listen 80;
    server_name xinghuanhai.com api.xinghuanhai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ===== 备案前：直接代理到后端 =====
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20M;
    }
    # ===== 备案后：替换上面 location / 块为 return 301 =====
    # return 301 https://$host$request_uri;
}

