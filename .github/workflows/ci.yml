name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  server:
    name: Server (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-源代码/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 03-源代码/server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  miniapp:
    name: Miniapp (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-源代码/小程序/miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 03-源代码/小程序/miniapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
