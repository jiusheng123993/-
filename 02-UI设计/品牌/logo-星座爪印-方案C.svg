  <circle cx="214" cy="138" r="26" fill="#FF6B3D"/>
  <circle cx="298" cy="138" r="26" fill="#FF6B3D"/>
  <circle cx="351" cy="170" r="26" fill="#FF6B3D"/>

  <!-- 主视觉：星光主掌垫 -->
  <path d="M 256 214 Q 288.3 281.7 356 310 Q 288.3 338.3 256 406 Q 223.7 338.3 156 310 Q 223.7 281.7 256 214 Z"
