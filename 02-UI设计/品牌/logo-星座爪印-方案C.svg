  <path d="M 256 52 Q 261 66 274 68 Q 261 70 256 84 Q 251 70 238 68 Q 251 66 256 52 Z" fill="#FFB020"/>
  <path d="M 432 96 Q 435 104 443 105 Q 435 106 432 114 Q 429 106 421 105 Q 429 104 432 96 Z" fill="#FFB020"/>
  <path d="M 84 220 Q 86 226 92 227 Q 86 228 84 234 Q 82 228 76 227 Q 82 226 84 220 Z" fill="#FFB020"/>
</svg>
