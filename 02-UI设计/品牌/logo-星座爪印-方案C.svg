    <line x1="161" y1="170" x2="256" y2="310"/>
    <line x1="214" y1="138" x2="256" y2="310"/>
    <line x1="298" y1="138" x2="256" y2="310"/>
    <line x1="351" y1="170" x2="256" y2="310"/>
  </g>

  <!-- 四颗爪趾星点 -->
