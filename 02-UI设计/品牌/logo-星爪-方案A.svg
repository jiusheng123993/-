<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA082"/>
      <stop offset="0.55" stop-color="#FF6B3D"/>
      <stop offset="1" stop-color="#F04E1D"/>
    </linearGradient>
  </defs>

  <!-- 奶油圆角底 -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#FFF6EE" stroke="#FFE0CF" stroke-width="4"/>

  <!-- 四颗金色爪趾 -->
  <ellipse cx="161" cy="170" rx="27" ry="38" fill="#FFB020" transform="rotate(-18 161 170)"/>
  <ellipse cx="214" cy="138" rx="27" ry="38" fill="#FFB020" transform="rotate(-8 214 138)"/>
  <ellipse cx="298" cy="138" rx="27" ry="38" fill="#FFB020" transform="rotate(8 298 138)"/>
  <ellipse cx="351" cy="170" rx="27" ry="38" fill="#FFB020" transform="rotate(18 351 170)"/>

  <!-- 主视觉：四角星光爪垫（星河 x 宠记的融合点） -->
  <path d="M 256 180 Q 294.9 261.1 376 300 Q 294.9 338.9 256 420 Q 217.1 338.9 136 300 Q 217.1 261.1 256 180 Z"
        fill="url(#coral)"/>

  <!-- 星光高光 -->
  <ellipse cx="232" cy="268" rx="26" ry="16" fill="#FFFFFF" opacity="0.35" transform="rotate(-38 232 268)"/>
</svg>
