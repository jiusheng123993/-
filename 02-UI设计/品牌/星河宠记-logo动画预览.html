<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星河宠记 · Logo 缓冲动画预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-7px) scale(1.02); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.85; }
    }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.5); }
      40%           { transform: scale(1); }
    }
    .splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #FFF6EE 0%, #FFEBDD 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .glow {
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 107, 61, 0.22), rgba(255, 107, 61, 0) 70%);
      animation: glowPulse 2.8s ease-in-out infinite;
    }
    .center {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .logo {
      width: 140px;
      height: 140px;
      animation: logoFloat 2.8s ease-in-out infinite;
      will-change: transform;
    }
    .logo img { width: 100%; height: 100%; display: block; }
    .name {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #FF6B3D, #FFB020);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: fadeIn 0.5s ease-out 0.2s both;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .dots { display: flex; gap: 9px; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FFB020;
      animation: dotBounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    .hint {
      position: fixed;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: #C9B39C;
      letter-spacing: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, .glow, .dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="glow"></div>
    <div class="center">
      <div class="logo"><img src="./图标-猫狗01-圆角.png" alt="星河宠记"></div>
      <div class="name">星河宠记</div>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
    <div class="hint">星河宠记 · 启动缓冲动画预览（浏览器打开可见动效）</div>
  </div>
</body>
</html>
