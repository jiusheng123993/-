/* ============================================
   星河宠记小程序 · 四季主题体系
   Q版奶萌 · 温馨 · 高饱和
   默认：秋 · 暖阳珊瑚橙 (Warm Coral)
   另含：春 · 嫩芽绿 / 夏 · 海盐蓝 / 冬 · 冰晶紫
   通过 html[data-theme] 切换
   ============================================ */

:root {
  /* ---- 基础语义色（秋 · 暖阳珊瑚橙） ---- */
  --xhh-background: #FFF6EE;
  --xhh-foreground: #40281C;

  --xhh-card: #FFFFFF;
  --xhh-card-foreground: #40281C;

  --xhh-popover: #FFFFFF;
  --xhh-popover-foreground: #40281C;

  --xhh-primary: #FF6B3D;
  --xhh-primary-foreground: #FFFFFF;

  --xhh-muted: #FFF0E4;
  --xhh-muted-foreground: #967A62;

  --xhh-border: #F3E2D2;
  --xhh-input: #FFF6EE;
  --xhh-ring: #FF6B3D;

  /* ---- 圆角（Q版圆润） ---- */
  --xhh-radius-sm: 12px;
  --xhh-radius-md: 20px;
  --xhh-radius-lg: 28px;
  --xhh-radius-full: 9999px;

  /* ---- 深度层次（暖色递进） ---- */
  --xhh-surface-1: #FFFDF9;
  --xhh-surface-2: #FFF6EE;
  --xhh-surface-3: #FFEDE0;

  /* ---- 文字层次 ---- */
  --xhh-ink: #40281C;
  --xhh-ink-2: #8B6E58;
  --xhh-ink-3: #B69B83;

  /* ---- 品牌珊瑚橙层次（高饱和） ---- */
  --xhh-coral: #FF6B3D;
  --xhh-coral-soft: #FFA082;
  --xhh-coral-deep: #F04E1D;
  --xhh-coral-bg: #FFF0E8;

  /* ---- 暖金点缀（同族暖色，仅装饰/状态） ---- */
  --xhh-gold: #FFB020;
  --xhh-gold-soft: #FFD068;
  --xhh-gold-deep: #E8920A;
  --xhh-gold-bg: #FFF6DC;

  /* ---- 状态色 ---- */
  --state-success: #2FC98E;
  --state-warning: #FFB020;
  --state-error: #FF5A5F;
  --state-info: #4FA3E3;

  /* ---- 字体系统 ---- */
  --xhh-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --xhh-font-display: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

  /* ---- 间距（8pt 栅格） ---- */
  --xhh-space-1: 4px;
  --xhh-space-2: 8px;
  --xhh-space-3: 12px;
  --xhh-space-4: 16px;
  --xhh-space-5: 24px;
  --xhh-space-6: 32px;
  --xhh-space-7: 48px;
  --xhh-space-8: 80px;

  /* ---- 阴影（Q版软萌立体，克制使用） ---- */
  --xhh-shadow-1: 0 1px 3px rgba(61, 33, 18, 0.05);
  --xhh-shadow-2: 0 12px 32px -12px rgba(240, 78, 29, 0.18);
  --xhh-shadow-card: 0 4px 20px -6px rgba(61, 33, 18, 0.08);
  --xhh-shadow-button: 0 6px 18px -4px rgba(255, 107, 61, 0.35);

  /* ---- 动态背景光斑色（跟随主题） ---- */
  --xhh-blob-a-color: rgba(255, 107, 61, 0.32);
  --xhh-blob-b-color: rgba(255, 176, 32, 0.24);
  --xhh-blob-c-color: rgba(255, 107, 61, 0.16);
  --xhh-blob-d-color: rgba(255, 176, 32, 0.15);
  --xhh-glow-color: rgba(255, 176, 32, 0.13);
}

/* ---- 全局字体 ---- */

/* ============================================
   全局动效系统（整个小程序共享）
   背景光斑 / 页面入场 / TabBar波纹 / 按压反馈
   ============================================ */

/* ---- 全屏动态背景层 ---- */
.xhh-bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.xhh-blob {
  position: absolute;
  border-radius: 9999px;
  filter: blur(60px);
  will-change: transform;
  opacity: 0.85;
}
.xhh-blob-a {
  width: 220px; height: 220px;
  top: -50px; left: -70px;
  background-color: var(--xhh-blob-a-color, rgba(255, 107, 61, 0.32));
  animation: xhh-blob-a 24s ease-in-out infinite alternate;
}
.xhh-blob-b {
  width: 180px; height: 180px;
  top: 140px; right: -80px;
  background-color: var(--xhh-blob-b-color, rgba(255, 176, 32, 0.24));
  animation: xhh-blob-b 28s ease-in-out infinite alternate;
}
.xhh-blob-c {
  width: 140px; height: 140px;
  bottom: 70px; left: -60px;
  background-color: var(--xhh-blob-c-color, rgba(255, 107, 61, 0.16));
  animation: xhh-blob-c 32s ease-in-out infinite alternate;
}
.xhh-blob-d {
  width: 120px; height: 120px;
  bottom: 180px; right: -40px;
  background-color: var(--xhh-blob-d-color, rgba(255, 176, 32, 0.15));
  animation: xhh-blob-d 26s ease-in-out infinite alternate;
}
@keyframes xhh-blob-a {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(62px, 48px) scale(1.14); }
  100% { transform: translate(20px, 84px) scale(0.95); }
}
@keyframes xhh-blob-b {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(-58px, -38px) scale(1.1); }
  100% { transform: translate(-32px, 34px) scale(0.93); }
}
@keyframes xhh-blob-c {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(48px, -44px) scale(1.16); }
  100% { transform: translate(74px, 12px) scale(1); }
}
@keyframes xhh-blob-d {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(-42px, 36px) scale(1.08); }
  100% { transform: translate(-16px, -30px) scale(0.94); }
}
.xhh-bg-glow {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130%; height: 340px;
  background: radial-gradient(ellipse at center, var(--xhh-glow-color, rgba(255, 176, 32, 0.13)) 0%, transparent 68%);
  animation: xhh-glow-pulse 7s ease-in-out infinite;
}
@keyframes xhh-glow-pulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* ---- 页面主体悬浮于背景之上 ---- */
.xhh-bg-layer + main,
.xhh-bg-layer + header + main,
body > main {
  position: relative;
  z-index: 10;
}
/* 顶部栏与底部条也要在背景之上 */
.xhh-bg-layer + *:not(main) {
  position: relative;
  z-index: 20;
}

/* ---- 页面入场：主体区块 cascade 上浮 ---- */
.xhh-page-enter > * {
  animation: xhh-page-rise 0.55s cubic-bezier(0.3, 0, 0, 1) both;
}
.xhh-page-enter > *:nth-child(1) { animation-delay: 0.04s; }
.xhh-page-enter > *:nth-child(2) { animation-delay: 0.1s; }
.xhh-page-enter > *:nth-child(3) { animation-delay: 0.16s; }
.xhh-page-enter > *:nth-child(4) { animation-delay: 0.22s; }
.xhh-page-enter > *:nth-child(5) { animation-delay: 0.28s; }
.xhh-page-enter > *:nth-child(6) { animation-delay: 0.34s; }
.xhh-page-enter > *:nth-child(7) { animation-delay: 0.4s; }
.xhh-page-enter > *:nth-child(8) { animation-delay: 0.46s; }
@keyframes xhh-page-rise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---- TabBar 波纹反馈 ---- */
.xhh-tab-ripple {
  position: relative;
  overflow: hidden;
}
.xhh-tab-ripple::after {
  content: '';
  position: absolute;
  inset: 0;
  margin: auto;
  width: 10px;
  height: 10px;
  border-radius: 9999px;
  background-color: currentColor;
  opacity: 0;
  transform: scale(0);
  transition: none;
  pointer-events: none;
}
.xhh-tab-ripple.xhh-rippling::after {
  animation: xhh-ripple 0.55s ease-out forwards;
}
@keyframes xhh-ripple {
  0% { opacity: 0.35; transform: scale(0); }
  100% { opacity: 0; transform: scale(26); }
}
/* TabBar 图标激活弹跳 */
.xhh-tab-bounce[data-active='true'] i {
  animation: xhh-tab-pop 0.5s cubic-bezier(0.32, 0.72, 0, 1);
}
@keyframes xhh-tab-pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.28) translateY(-2px); }
  100% { transform: scale(1); }
}

/* ---- 通用按压反馈 ---- */
.xhh-tap {
  transition: transform 0.14s ease, opacity 0.14s ease;
}
.xhh-tap:active {
  transform: scale(0.95);
  opacity: 0.85;
}

/* ---- 卡片滚动 reveal ---- */
.xhh-reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.55s cubic-bezier(0.3, 0, 0, 1), transform 0.55s cubic-bezier(0.3, 0, 0, 1);
}
.xhh-reveal.xhh-revealed {
  opacity: 1;
  transform: translateY(0);
}

/* ---- 减少动态效果偏好（全小程序生效） ---- */
@media (prefers-reduced-motion: reduce) {
  .xhh-blob, .xhh-bg-glow, .xhh-page-enter > *, .xhh-tab-ripple::after, .xhh-tab-bounce[data-active='true'] i {
    animation: none !important;
  }
  .xhh-reveal {
    opacity: 1;
    transform: none;
    transition: none !important;
  }
  .xhh-tap { transition: none !important; }
}

        .xhh-tap:active{transform:scale(.95);opacity:.85}
        @media (prefers-reduced-motion: reduce){
            .xhh-blob,.xhh-bg-glow,.xhh-page-enter > *,.xhh-tab-ripple::after,.xhh-tab-bounce[data-active='true'] i{animation:none !important}
            .xhh-tap{transition:none !important}
        }
    </style>

    <script id="xhh-motion-init">
        (function () {
            // TabBar 点击波纹
            var nav = document.querySelector('nav[data-mobile-nav="global"]');
            if (nav) {
                nav.classList.add('xhh-tab-ripple');
                var items = nav.querySelectorAll('a');
                items.forEach(function (a) {
                    a.addEventListener('click', function (e) {
                        e.preventDefault();
                        nav.classList.remove('xhh-rippling');
                        void nav.offsetWidth;
                        nav.classList.add('xhh-rippling');
                        items.forEach(function (x) {
                            var active = x === a;
                            x.setAttribute('data-active', active ? 'true' : 'false');
                            x.style.color = active ? 'var(--xhh-coral)' : 'var(--xhh-ink-3)';
                            var label = x.querySelector('span');
                            if (label) label.classList.toggle('font-semibold', active);
                        });
                        setTimeout(function () { nav.classList.remove('xhh-rippling'); }, 600);
                    });
                });
                nav.classList.add('xhh-tab-bounce');
            }
            // 主体入场
            var main = document.querySelector('main');
            if (main && !main.classList.contains('xhh-page-enter')) {
                main.classList.add('xhh-page-enter');
            }
        })();
    </script>

    <script id="xhh-theme-apply">
        (function () {
            var THEMES = ['spring', 'summer', 'autumn', 'winter'];
            var KEY = 'xhh-theme';
            var html = document.documentElement;
            var saved = null;
            try { saved = localStorage.getItem(KEY); } catch (e) { saved = null; }
            html.setAttribute('data-theme', (saved && THEMES.indexOf(saved) !== -1) ? saved : 'autumn');
        })();
    </script>

    <script>
        lucide.createIcons();

        // 年份胶囊切换（仅展示交互）
        (function () {
            var pills = document.querySelectorAll('.xhh-year-pill');
            pills.forEach(function (pill) {
                pill.addEventListener('click', function () {
                    pills.forEach(function (p) {
                        var on = p === pill;
                        p.classList.toggle('xhh-year-pill--active', on);
                        p.setAttribute('aria-selected', on ? 'true' : 'false');
                    });
                });
            });
        })();
    </script>

</body>
</html>
