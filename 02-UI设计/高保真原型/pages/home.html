/* ============================================
   星寰海小程序 · 四季主题体系
   Q版奶萌 · 温馨 · 高饱和
   默认：秋 · 暖阳珊瑚橙 (Warm Coral)
   另含：春 · 嫩芽绿 / 夏 · 海盐蓝 / 冬 · 冰晶紫
   通过 html[data-theme] 切换
   ============================================ */

:root {
  /* ---- 基础语义色（秋 · 暖阳珊瑚橙） ---- */
  --xhh-background: #FFF6EE;
  --xhh-foreground: #40281C;
  --xhh-card: #FFFFFF;
  --xhh-card-foreground: #40281C;
  --xhh-popover: #FFFFFF;
  --xhh-popover-foreground: #40281C;
  --xhh-primary: #FF6B3D;
  --xhh-primary-foreground: #FFFFFF;
  --xhh-muted: #FFF0E4;
  --xhh-muted-foreground: #967A62;
  --xhh-border: #F3E2D2;
  --xhh-input: #FFF6EE;
  --xhh-ring: #FF6B3D;

  /* ---- 圆角（Q版圆润） ---- */
  --xhh-radius-sm: 12px;
  --xhh-radius-md: 20px;
  --xhh-radius-lg: 28px;
  --xhh-radius-full: 9999px;

  /* ---- 深度层次（暖色递进） ---- */
  --xhh-surface-1: #FFFDF9;
  --xhh-surface-2: #FFF6EE;
  --xhh-surface-3: #FFEDE0;

  /* ---- 文字层次 ---- */
  --xhh-ink: #40281C;
  --xhh-ink-2: #8B6E58;
  --xhh-ink-3: #B69B83;

  /* ---- 品牌珊瑚橙层次（高饱和） ---- */
  --xhh-coral: #FF6B3D;
  --xhh-coral-soft: #FFA082;
  --xhh-coral-deep: #F04E1D;
  --xhh-coral-bg: #FFF0E8;

  /* ---- 暖金点缀（同族暖色，仅装饰/状态） ---- */
  --xhh-gold: #FFB020;
  --xhh-gold-soft: #FFD068;
  --xhh-gold-deep: #E8920A;
  --xhh-gold-bg: #FFF6DC;

  /* ---- 状态色 ---- */
  --state-success: #2FC98E;
  --state-warning: #FFB020;
  --state-error: #FF5A5F;
  --state-info: #4FA3E3;

  /* ---- 字体系统 ---- */
  --xhh-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --xhh-font-display: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

  /* ---- 间距（8pt 栅格） ---- */
  --xhh-space-1: 4px;
  --xhh-space-2: 8px;
  --xhh-space-3: 12px;
  --xhh-space-4: 16px;
  --xhh-space-5: 24px;
  --xhh-space-6: 32px;
  --xhh-space-7: 48px;
  --xhh-space-8: 80px;

  /* ---- 阴影（Q版软萌立体，克制使用） ---- */
  --xhh-shadow-1: 0 1px 3px rgba(61, 33, 18, 0.05);
  --xhh-shadow-2: 0 12px 32px -12px rgba(240, 78, 29, 0.18);
  --xhh-shadow-card: 0 4px 20px -6px rgba(61, 33, 18, 0.08);
  --xhh-shadow-button: 0 6px 18px -4px rgba(255, 107, 61, 0.35);

  /* ---- 动态背景光斑色（跟随主题） ---- */
  --xhh-blob-a-color: rgba(255, 107, 61, 0.32);
  --xhh-blob-b-color: rgba(255, 176, 32, 0.24);
  --xhh-blob-c-color: rgba(255, 107, 61, 0.16);
  --xhh-blob-d-color: rgba(255, 176, 32, 0.15);
  --xhh-glow-color: rgba(255, 176, 32, 0.13);
}

    <style id="critical-layout">
/* ============================================
   critical-layout：关键布局静态兜底
   Tailwind CDN 不可用时，核心结构仍完整渲染
   （聊天主区 / 卡片 / 气泡 / 网格 / 输入区 / TabBar）
   ============================================ */
html, body { overflow-x: hidden; }
body {
  background: var(--xhh-background);
  color: var(--xhh-foreground);
  font-family: var(--xhh-font-sans);
  -webkit-font-smoothing: antialiased;
}

/* ---- 顶部小程序导航栏 ---- */
.xhh-navbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--xhh-surface-1) 90%, transparent);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--xhh-border);
}
.xhh-navbar-inner {
  width: 100%; max-width: 28rem; margin: 0 auto;
  height: 3rem;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 0.75rem;
}
.xhh-nav-brand { display: flex; align-items: baseline; gap: 0.5rem; min-width: 0; }
.xhh-nav-capsule {
  display: flex; align-items: center; flex-shrink: 0;
  height: 2rem; border-radius: 9999px;
  border: 1px solid var(--xhh-border);
  background-color: var(--xhh-card);
}

/* ---- 聊天式消息主区 ---- */
.xhh-chat-main {
  position: relative; z-index: 10;
  width: 100%; max-width: 28rem; margin: 0 auto;
  padding: 0.75rem 1rem 9rem;
  display: flex; flex-direction: column; gap: 0.75rem;
}

/* ---- 通用卡片 ---- */
.xhh-panel-card { border-radius: 20px; min-width: 0; }
.xhh-round { border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ---- 聊天气泡 ---- */
.xhh-chat-bubble { max-width: 80%; border-radius: 16px; line-height: 1.65; }

/* ---- 快捷操作胶囊行 ---- */
.xhh-chips-row { display: flex; align-items: center; gap: 0.5rem; padding-left: 2.5rem; }
.xhh-chip {
  flex: 1 1 0%; min-width: 0; height: 2.25rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem;
  border-radius: 9999px; font-size: 13px; font-weight: 500;
  white-space: nowrap;
}

/* ---- 快捷功能网格 ---- */
.xhh-grid-2 {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.625rem;
}
.xhh-grid-card {
  display: flex; align-items: center; gap: 0.75rem;
  border-radius: 20px; padding: 0.875rem; min-width: 0;
}

/* ---- 底部输入区（固定在 TabBar 上方） ---- */
.xhh-input-dock {
  position: fixed; left: 0; right: 0; bottom: 3.5rem; z-index: 40;
}
.xhh-input-shell {
  position: relative; width: 100%; max-width: 28rem; margin: 0 auto;
  padding: 0.5rem 0.75rem 0.625rem;
  background: color-mix(in srgb, var(--xhh-surface-1) 92%, transparent);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--xhh-border);
}
.xhh-input-row { display: flex; align-items: center; gap: 0.5rem; }
.xhh-round-btn {
  width: 2.5rem; height: 2.5rem; border-radius: 9999px;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.xhh-input-field {
  flex: 1 1 0%; min-width: 0; height: 2.5rem; border-radius: 9999px;
  padding: 0 1rem; outline: none; font-size: 13.5px;
  background: var(--xhh-muted); color: var(--xhh-ink);
  border: 1px solid var(--xhh-border);
}
.xhh-input-field::placeholder { color: var(--xhh-ink-3); }

/* ---- 展开面板（2 行网格） ---- */
.xhh-more-panel {
  position: absolute; left: 0.75rem; right: 0.75rem; bottom: 100%;
  margin-bottom: 0.5rem; border-radius: 20px;
  background: var(--xhh-card); border: 1px solid var(--xhh-border);
  box-shadow: var(--xhh-shadow-2); padding: 0.75rem;
}
.xhh-more-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }
.xhh-more-item {

                    <button type="button" class="xhh-more-item xhh-tap" aria-label="记录回忆">
                        <span class="xhh-round w-11 h-11" style="background: color-mix(in srgb, var(--xhh-coral) 14%, transparent);">
                            <span class="text-[20px] leading-none" aria-hidden="true">📸</span>
                        </span>
                        <span class="text-[11px] font-medium" style="color: var(--xhh-ink-2);">记录回忆</span>
                    </button>
                    <button type="button" class="xhh-more-item xhh-tap" aria-label="看家庭">
                        <span class="xhh-round w-11 h-11" style="background: color-mix(in srgb, var(--state-info) 14%, transparent);">
                            <span class="text-[20px] leading-none" aria-hidden="true">🏠</span>
                        </span>
                        <span class="text-[11px] font-medium" style="color: var(--xhh-ink-2);">看家庭</span>
                    </button>
                </div>
            </div>
            <!-- 输入行 -->
            <div class="xhh-input-row flex items-center gap-2">
                <button type="button" id="xhh-mic-btn" class="xhh-round-btn xhh-tap" aria-label="语音输入" style="background: var(--xhh-muted); color: var(--xhh-ink-2);">
                    <i data-lucide="mic" class="w-5 h-5"></i>
                </button>
                <input type="text" id="xhh-chat-input" placeholder="说说宠物今天的情况..." autocomplete="off" class="xhh-input-field min-w-0 flex-1 h-10 rounded-full px-4 text-[13.5px] outline-none" style="background: var(--xhh-muted); color: var(--xhh-ink); border: 1px solid var(--xhh-border);">
                <button type="button" id="xhh-send-btn" class="xhh-round-btn xhh-tap" aria-label="发送或展开" style="background: var(--xhh-muted); color: var(--xhh-ink-2);">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ===================== 底部 TabBar（首页激活态） ===================== -->
    <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 z-50 h-14 bg-white/95 backdrop-blur-xl border-t" style="border-color: var(--xhh-border);"><div class="w-full max-w-md mx-auto grid grid-cols-4 h-full"><a data-nav-key="home" data-active="true" href="#" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full" style="color: var(--xhh-coral);"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate font-semibold">首页</span></a><a data-nav-key="pet" href="#" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full" style="color: var(--xhh-ink-3);"><i data-lucide="paw-print" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">宠物</span></a><a data-nav-key="timeline" href="#" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full" style="color: var(--xhh-ink-3);"><i data-lucide="history" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">时光</span></a><a data-nav-key="mine" href="#" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full" style="color: var(--xhh-ink-3);"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>
    <script>lucide.createIcons();</script>

    <script id="xhh-theme-apply">
    (function () {
        var THEMES = ['spring', 'summer', 'autumn', 'winter'];
        var KEY = 'xhh-theme';
        var html = document.documentElement;
        var saved = null;
        try { saved = localStorage.getItem(KEY); } catch (e) { saved = null; }
        html.setAttribute('data-theme', (saved && THEMES.indexOf(saved) !== -1) ? saved : 'autumn');
    })();
    </script>

    <script id="xhh-home-interactions">
    (function () {
        // ---- 输入区：+ / 发送态切换 + 展开面板 ----
        var panel = document.getElementById('xhh-more-panel');
        var sendBtn = document.getElementById('xhh-send-btn');
        var input = document.getElementById('xhh-chat-input');
        function syncSendBtn() {
            if (!sendBtn || !input) return;
            var hasText = input.value.trim().length > 0;
            var icon = sendBtn.querySelector('i');
            if (icon) {
                icon.setAttribute('data-lucide', hasText ? 'arrow-up' : 'plus');
                icon.classList.toggle('w-5', true);
            }
            if (window.lucide) { lucide.createIcons(); }
            sendBtn.style.background = hasText
                ? 'linear-gradient(135deg, var(--xhh-coral-soft), var(--xhh-coral))'
                : 'var(--xhh-muted)';
            sendBtn.style.color = hasText ? 'var(--xhh-primary-foreground)' : 'var(--xhh-ink-2)';
            sendBtn.style.boxShadow = hasText ? 'var(--xhh-shadow-button)' : 'none';
            if (hasText && panel) { panel.classList.add('xhh-hidden'); }
        }
        if (input) { input.addEventListener('input', syncSendBtn); }
        if (sendBtn) {
            sendBtn.addEventListener('click', function () {
                if (input && input.value.trim().length > 0) {
                    input.value = '';
                    syncSendBtn();
                    input.focus();
                } else if (panel) {
                    panel.classList.toggle('xhh-hidden');
                }
            });
        }
        if (panel) {
            panel.querySelectorAll('button').forEach(function (b) {
                b.addEventListener('click', function () { panel.classList.add('xhh-hidden'); });
            });
        }

        // ---- TabBar 点击波纹 + 激活态切换 ----
        var nav = document.querySelector('nav[data-mobile-nav="global"]');
        if (nav) {
            var items = nav.querySelectorAll('a');
            items.forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    nav.classList.remove('xhh-rippling');
                    void nav.offsetWidth;
                    nav.classList.add('xhh-rippling');
                    items.forEach(function (x) {
                        var active = x === a;
                        x.setAttribute('data-active', active ? 'true' : 'false');
                        x.style.color = active ? 'var(--xhh-coral)' : 'var(--xhh-ink-3)';
                        var label = x.querySelector('span');
                        if (label) label.classList.toggle('font-semibold', active);
                    });
                    setTimeout(function () { nav.classList.remove('xhh-rippling'); }, 600);
                });
            });
            nav.classList.add('xhh-tab-bounce');
        }

        // ---- 主体入场 ----
        var main = document.querySelector('main');
        if (main && !main.classList.contains('xhh-page-enter')) {
            main.classList.add('xhh-page-enter');
        }
    })();
    </script>
</body>
</html>
