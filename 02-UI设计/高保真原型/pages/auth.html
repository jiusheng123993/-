/* ============================================
   星寰海小程序 · 四季主题体系
   Q版奶萌 · 温馨 · 高饱和
   默认：秋 · 暖阳珊瑚橙 (Warm Coral)
   另含：春 · 嫩芽绿 / 夏 · 海盐蓝 / 冬 · 冰晶紫
   通过 html[data-theme] 切换
   ============================================ */

:root {
  /* ---- 基础语义色（秋 · 暖阳珊瑚橙） ---- */
  --xhh-background: #FFF6EE;
  --xhh-foreground: #40281C;

  --xhh-card: #FFFFFF;
  --xhh-card-foreground: #40281C;

  --xhh-popover: #FFFFFF;
  --xhh-popover-foreground: #40281C;

  --xhh-primary: #FF6B3D;
  --xhh-primary-foreground: #FFFFFF;

  --xhh-muted: #FFF0E4;
  --xhh-muted-foreground: #967A62;

  --xhh-border: #F3E2D2;
  --xhh-input: #FFF6EE;
  --xhh-ring: #FF6B3D;

  /* ---- 圆角（Q版圆润） ---- */
  --xhh-radius-sm: 12px;
  --xhh-radius-md: 20px;
  --xhh-radius-lg: 28px;
  --xhh-radius-full: 9999px;

  /* ---- 深度层次（暖色递进） ---- */
  --xhh-surface-1: #FFFDF9;
  --xhh-surface-2: #FFF6EE;
  --xhh-surface-3: #FFEDE0;

  /* ---- 文字层次 ---- */
  --xhh-ink: #40281C;
  --xhh-ink-2: #8B6E58;
  --xhh-ink-3: #B69B83;

  /* ---- 品牌珊瑚橙层次（高饱和） ---- */
  --xhh-coral: #FF6B3D;
  --xhh-coral-soft: #FFA082;
  --xhh-coral-deep: #F04E1D;
  --xhh-coral-bg: #FFF0E8;

  /* ---- 暖金点缀（同族暖色，仅装饰/状态） ---- */
  --xhh-gold: #FFB020;
  --xhh-gold-soft: #FFD068;
  --xhh-gold-deep: #E8920A;
  --xhh-gold-bg: #FFF6DC;

  /* ---- 状态色 ---- */
  --state-success: #2FC98E;
  --state-warning: #FFB020;
  --state-error: #FF5A5F;
  --state-info: #4FA3E3;

  /* ---- 字体系统 ---- */
  --xhh-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --xhh-font-display: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

  /* ---- 间距（8pt 栅格） ---- */
  --xhh-space-1: 4px;
  --xhh-space-2: 8px;
  --xhh-space-3: 12px;
  --xhh-space-4: 16px;
  --xhh-space-5: 24px;
  --xhh-space-6: 32px;
  --xhh-space-7: 48px;
  --xhh-space-8: 80px;

  /* ---- 阴影（Q版软萌立体，克制使用） ---- */
  --xhh-shadow-1: 0 1px 3px rgba(61, 33, 18, 0.05);
  --xhh-shadow-2: 0 12px 32px -12px rgba(240, 78, 29, 0.18);
  --xhh-shadow-card: 0 4px 20px -6px rgba(61, 33, 18, 0.08);
  --xhh-shadow-button: 0 6px 18px -4px rgba(255, 107, 61, 0.35);

  /* ---- 动态背景光斑色（跟随主题） ---- */
  --xhh-blob-a-color: rgba(255, 107, 61, 0.32);
  --xhh-blob-b-color: rgba(255, 176, 32, 0.24);
  --xhh-blob-c-color: rgba(255, 107, 61, 0.16);
  --xhh-blob-d-color: rgba(255, 176, 32, 0.15);
  --xhh-glow-color: rgba(255, 176, 32, 0.13);
}

/* ---- 全局字体 ---- */

/* ============================================
   全局动效系统（整个小程序共享）
   背景光斑 / 页面入场 / TabBar波纹 / 按压反馈
   ============================================ */

/* ---- 全屏动态背景层 ---- */
.xhh-bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.xhh-blob {
  position: absolute;
  border-radius: 9999px;
  filter: blur(60px);
  will-change: transform;
  opacity: 0.85;
}
.xhh-blob-a {
  width: 220px; height: 220px;
  top: -50px; left: -70px;
  background-color: var(--xhh-blob-a-color, rgba(255, 107, 61, 0.32));
  animation: xhh-blob-a 24s ease-in-out infinite alternate;
}
.xhh-blob-b {
  width: 180px; height: 180px;
  top: 140px; right: -80px;
  background-color: var(--xhh-blob-b-color, rgba(255, 176, 32, 0.24));
  animation: xhh-blob-b 28s ease-in-out infinite alternate;
}
.xhh-blob-c {
  width: 140px; height: 140px;
  bottom: 70px; left: -60px;
  background-color: var(--xhh-blob-c-color, rgba(255, 107, 61, 0.16));
  animation: xhh-blob-c 32s ease-in-out infinite alternate;
}
.xhh-blob-d {
  width: 120px; height: 120px;
  bottom: 180px; right: -40px;
  background-color: var(--xhh-blob-d-color, rgba(255, 176, 32, 0.15));
  animation: xhh-blob-d 26s ease-in-out infinite alternate;
}
@keyframes xhh-blob-a {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(62px, 48px) scale(1.14); }
  100% { transform: translate(20px, 84px) scale(0.95); }
}
@keyframes xhh-blob-b {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(-58px, -38px) scale(1.1); }
  100% { transform: translate(-32px, 34px) scale(0.93); }
}
@keyframes xhh-blob-c {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(48px, -44px) scale(1.16); }
  100% { transform: translate(74px, 12px) scale(1); }
}
@keyframes xhh-blob-d {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(-42px, 36px) scale(1.08); }
  100% { transform: translate(-16px, -30px) scale(0.94); }
}
.xhh-bg-glow {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130%; height: 340px;
  background: radial-gradient(ellipse at center, var(--xhh-glow-color, rgba(255, 176, 32, 0.13)) 0%, transparent 68%);
  animation: xhh-glow-pulse 7s ease-in-out infinite;
}
@keyframes xhh-glow-pulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* ---- 页面主体悬浮于背景之上 ---- */
.xhh-bg-layer + main,
.xhh-bg-layer + header + main,
body > main {
  position: relative;
  z-index: 10;
}
/* 顶部栏与底部条也要在背景之上 */
.xhh-bg-layer + *:not(main) {
  position: relative;
  z-index: 20;
}

/* ---- 页面入场：主体区块 cascade 上浮 ---- */
.xhh-page-enter > * {
  animation: xhh-page-rise 0.55s cubic-bezier(0.3, 0, 0, 1) both;
}
.xhh-page-enter > *:nth-child(1) { animation-delay: 0.04s; }
.xhh-page-enter > *:nth-child(2) { animation-delay: 0.1s; }
.xhh-page-enter > *:nth-child(3) { animation-delay: 0.16s; }
.xhh-page-enter > *:nth-child(4) { animation-delay: 0.22s; }
.xhh-page-enter > *:nth-child(5) { animation-delay: 0.28s; }
.xhh-page-enter > *:nth-child(6) { animation-delay: 0.34s; }
.xhh-page-enter > *:nth-child(7) { animation-delay: 0.4s; }
.xhh-page-enter > *:nth-child(8) { animation-delay: 0.46s; }
@keyframes xhh-page-rise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---- TabBar 波纹反馈 ---- */
.xhh-tab-ripple {
  position: relative;
  overflow: hidden;
}
.xhh-tab-ripple::after {
  content: '';
  position: absolute;
  inset: 0;
  margin: auto;
  width: 10px;
  height: 10px;
  border-radius: 9999px;
  background-color: currentColor;
  opacity: 0;
  transform: scale(0);
  transition: none;
  pointer-events: none;
}
.xhh-tab-ripple.xhh-rippling::after {
  animation: xhh-ripple 0.55s ease-out forwards;
}
@keyframes xhh-ripple {
  0% { opacity: 0.35; transform: scale(0); }
  100% { opacity: 0; transform: scale(26); }
}
/* TabBar 图标激活弹跳 */
.xhh-tab-bounce[data-active='true'] i {
  animation: xhh-tab-pop 0.5s cubic-bezier(0.32, 0.72, 0, 1);
}
@keyframes xhh-tab-pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.28) translateY(-2px); }
  100% { transform: scale(1); }
}

/* ---- 通用按压反馈 ---- */
.xhh-tap {
  transition: transform 0.14s ease, opacity 0.14s ease;
}
.xhh-tap:active {
  transform: scale(0.95);
  opacity: 0.85;
}

/* ---- 卡片滚动 reveal ---- */
.xhh-reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.55s cubic-bezier(0.3, 0, 0, 1), transform 0.55s cubic-bezier(0.3, 0, 0, 1);
}
.xhh-reveal.xhh-revealed {
  opacity: 1;
  transform: translateY(0);
}

/* ---- 减少动态效果偏好（全小程序生效） ---- */
@media (prefers-reduced-motion: reduce) {
  .xhh-blob, .xhh-bg-glow, .xhh-page-enter > *, .xhh-tab-ripple::after, .xhh-tab-bounce[data-active='true'] i {
    animation: none !important;
  }
  .xhh-reveal {
    opacity: 1;
    transform: none;
    transition: none !important;
  }
  .xhh-tap { transition: none !important; }
}

      .text-primary { color: var(--xhh-primary); }
      .border-primary { border-color: var(--xhh-primary); }
      .ring-primary { --tw-ring-color: var(--xhh-primary); }
      .bg-primary-foreground { background-color: var(--xhh-primary-foreground); }
      .text-primary-foreground { color: var(--xhh-primary-foreground); }
      .border-primary-foreground { border-color: var(--xhh-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--xhh-primary-foreground); }
      .bg-muted { background-color: var(--xhh-muted); }
      .text-muted { color: var(--xhh-muted); }
      .border-muted { border-color: var(--xhh-muted); }
      .ring-muted { --tw-ring-color: var(--xhh-muted); }
      .bg-muted-foreground { background-color: var(--xhh-muted-foreground); }
      .text-muted-foreground { color: var(--xhh-muted-foreground); }
      .border-muted-foreground { border-color: var(--xhh-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--xhh-muted-foreground); }
      .bg-border { background-color: var(--xhh-border); }
      .text-border { color: var(--xhh-border); }
      .border-border { border-color: var(--xhh-border); }
      .ring-border { --tw-ring-color: var(--xhh-border); }
      .bg-input { background-color: var(--xhh-input); }
      .text-input { color: var(--xhh-input); }
      .border-input { border-color: var(--xhh-input); }
      .ring-input { --tw-ring-color: var(--xhh-input); }
      .bg-ring { background-color: var(--xhh-ring); }
      .text-ring { color: var(--xhh-ring); }
      .border-ring { border-color: var(--xhh-ring); }
      .ring-ring { --tw-ring-color: var(--xhh-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <style id="xhh-motion-system">
        .xhh-bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
        .xhh-blob{position:absolute;border-radius:9999px;filter:blur(60px);will-change:transform;opacity:.85}
        .xhh-blob-a{width:220px;height:220px;top:-50px;left:-70px;background-color:var(--xhh-blob-a-color,rgba(255,107,61,.32));animation:xhh-blob-a 24s ease-in-out infinite alternate}
        .xhh-blob-b{width:180px;height:180px;top:140px;right:-80px;background-color:var(--xhh-blob-b-color,rgba(255,176,32,.24));animation:xhh-blob-b 28s ease-in-out infinite alternate}
        .xhh-blob-c{width:140px;height:140px;bottom:70px;left:-60px;background-color:var(--xhh-blob-c-color,rgba(255,107,61,.16));animation:xhh-blob-c 32s ease-in-out infinite alternate}
        .xhh-blob-d{width:120px;height:120px;bottom:180px;right:-40px;background-color:var(--xhh-blob-d-color,rgba(255,176,32,.15));animation:xhh-blob-d 26s ease-in-out infinite alternate}
        @keyframes xhh-blob-a{0%{transform:translate(0,0) scale(1)}50%{transform:translate(62px,48px) scale(1.14)}100%{transform:translate(20px,84px) scale(.95)}}
        @keyframes xhh-blob-b{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-58px,-38px) scale(1.1)}100%{transform:translate(-32px,34px) scale(.93)}}
        @keyframes xhh-blob-c{0%{transform:translate(0,0) scale(1)}50%{transform:translate(48px,-44px) scale(1.16)}100%{transform:translate(74px,12px) scale(1)}}
        @keyframes xhh-blob-d{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-42px,36px) scale(1.08)}100%{transform:translate(-16px,-30px) scale(.94)}}
        .xhh-bg-glow{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130%;height:340px;background:radial-gradient(ellipse at center,var(--xhh-glow-color,rgba(255,176,32,.13)) 0%,transparent 68%);animation:xhh-glow-pulse 7s ease-in-out infinite}
        @keyframes xhh-glow-pulse{0%,100%{opacity:.7}50%{opacity:1}}
        .xhh-bg-layer + main,body > main{position:relative;z-index:10}
        .xhh-page-enter > *{animation:xhh-page-rise .55s cubic-bezier(.3,0,0,1) both}
        .xhh-page-enter > *:nth-child(1){animation-delay:.04s}.xhh-page-enter > *:nth-child(2){animation-delay:.1s}
        .xhh-page-enter > *:nth-child(3){animation-delay:.16s}.xhh-page-enter > *:nth-child(4){animation-delay:.22s}
        .xhh-page-enter > *:nth-child(5){animation-delay:.28s}.xhh-page-enter > *:nth-child(6){animation-delay:.34s}
        .xhh-page-enter > *:nth-child(7){animation-delay:.4s}.xhh-page-enter > *:nth-child(8){animation-delay:.46s}
        @keyframes xhh-page-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        .xhh-tab-ripple{position:relative;overflow:hidden}
        .xhh-tab-ripple::after{content:'';position:absolute;inset:0;margin:auto;width:10px;height:10px;border-radius:9999px;background-color:currentColor;opacity:0;transform:scale(0);transition:none;pointer-events:none}
        .xhh-tab-ripple.xhh-rippling::after{animation:xhh-ripple .55s ease-out forwards}
        @keyframes xhh-ripple{0%{opacity:.35;transform:scale(0)}100%{opacity:0;transform:scale(26)}}
        .xhh-tab-bounce[data-active='true'] i{animation:xhh-tab-pop .5s cubic-bezier(.32,.72,0,1)}
        @keyframes xhh-tab-pop{0%{transform:scale(1)}40%{transform:scale(1.28) translateY(-2px)}100%{transform:scale(1)}}
        .xhh-tap{transition:transform .14s ease,opacity .14s ease}
        .xhh-tap:active{transform:scale(.95);opacity:.85}
        @media (prefers-reduced-motion: reduce){
            .xhh-blob,.xhh-bg-glow,.xhh-page-enter > *,.xhh-tab-ripple::after,.xhh-tab-bounce[data-active='true'] i{animation:none !important}
            .xhh-tap{transition:none !important}
        }
    </style>
    <script id="xhh-theme-apply">
        (function () {
            var THEMES = ['spring', 'summer', 'autumn', 'winter'];
            var KEY = 'xhh-theme';
            var html = document.documentElement;
            var saved = null;
            try { saved = localStorage.getItem(KEY); } catch (e) { saved = null; }
            html.setAttribute('data-theme', (saved && THEMES.indexOf(saved) !== -1) ? saved : 'autumn');
        })();
    </script>
</head>
<body class="min-h-screen font-sans antialiased">
    <!-- 全小程序统一动态背景层 -->
    <div class="xhh-bg-layer" aria-hidden="true">
        <div class="xhh-blob xhh-blob-a"></div>
        <div class="xhh-blob xhh-blob-b"></div>
        <div class="xhh-blob xhh-blob-c"></div>
        <div class="xhh-blob xhh-blob-d"></div>
        <div class="xhh-bg-glow"></div>
    </div>

    <!-- 顶部导航栏（登录页独立，无 TabBar） -->
    <header class="sticky top-0 z-40" style="background-color: color-mix(in srgb, var(--xhh-background) 92%, transparent); backdrop-filter: blur(16px);">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-baseline gap-2">
                <span class="text-xl font-extrabold leading-none bg-clip-text text-transparent" style="background-image: linear-gradient(135deg, var(--xhh-coral-soft), var(--xhh-coral));">星寰海</span>
                <span class="text-[11px] leading-none" style="color: var(--xhh-ink-3);">AI 宠物管家</span>
            </div>
            <div class="flex h-8 w-[88px] shrink-0 items-center justify-center rounded-full border" style="border-color: var(--xhh-border); background-color: var(--xhh-card);" aria-label="小程序菜单">
                <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="更多">
                    <i data-lucide="more-horizontal" class="h-4 w-4"></i>
                </button>
                <span class="h-4 w-px" style="background-color: var(--xhh-border);" aria-hidden="true"></span>
                <button type="button" class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
                    <i data-lucide="x" class="h-4 w-4"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="xhh-page-enter xhh-main-auth max-w-md mx-auto px-6 pt-8 pb-16 flex flex-col gap-6 items-center relative z-10">
        <!-- 1. 品牌区：珊瑚渐变 Logo + slogan -->
        <section class="auth-brand" data-dom-id="auth-brand" aria-label="星寰海品牌">
            <span class="auth-brand-badge" aria-hidden="true">
                <i data-lucide="paw-print" class="w-6 h-6"></i>
            </span>
            <h1 class="auth-logo">星寰海</h1>
            <p class="auth-slogan">AI 宠物管家，懂 TA 的一生</p>
        </section>

        <!-- 2. 主视觉：招爪橘猫 -->
        <div class="auth-hero-card" data-dom-id="auth-hero" aria-label="招爪橘猫">
            <img src="../assets/auth-hero.png" alt="招爪橘猫" class="auth-hero-img">
        </div>

        <!-- 3. 功能预览行：打卡 / 疫苗 / 食物查询 / 时光线 -->
        <section class="auth-features" data-dom-id="auth-features" aria-label="核心功能预览">
            <div class="auth-feature">
                <span class="auth-feature-icon"><i data-lucide="calendar-check" class="w-5 h-5"></i></span>
                <span class="auth-feature-label">健康打卡</span>
            </div>
            <div class="auth-feature">
                <span class="auth-feature-icon"><i data-lucide="syringe" class="w-5 h-5"></i></span>
                <span class="auth-feature-label">疫苗日历</span>
            </div>
            <div class="auth-feature">
                <span class="auth-feature-icon"><i data-lucide="search" class="w-5 h-5"></i></span>
                <span class="auth-feature-label">食物查询</span>
            </div>
            <div class="auth-feature">
                <span class="auth-feature-icon"><i data-lucide="history" class="w-5 h-5"></i></span>
                <span class="auth-feature-label">时光记录</span>
            </div>
        </section>

        <!-- 4. 微信一键登录主按钮 -->
        <button type="button" class="auth-btn-wechat auth-press" data-dom-id="auth-btn-wechat">
            <i data-lucide="message-circle" class="w-5 h-5"></i>
            <span>微信一键登录</span>
        </button>

        <!-- 5. 手机号登录次入口 -->
        <button type="button" class="auth-btn-phone auth-press" data-dom-id="auth-btn-phone">
            <i data-lucide="smartphone" class="w-4 h-4"></i>
            <span>手机号登录</span>
        </button>

        <!-- 6. 隐私协议勾选行 -->
        <label class="auth-agree" data-dom-id="auth-agree">
            <input type="checkbox" class="xhh-check" aria-label="同意用户协议与隐私政策">
            <span class="auth-agree-text">我已阅读并同意</span>
            <a href="#" class="auth-agree-link" onclick="event.preventDefault(); event.stopPropagation();">《用户协议》</a>
            <span class="auth-agree-text">和</span>
            <a href="#" class="auth-agree-link" onclick="event.preventDefault(); event.stopPropagation();">《隐私政策》</a>
        </label>
    </main>

    <style id="critical-layout">
        /* ============================================
           登录页 · critical layout（静态兜底）
           全部颜色仅使用 var(--xhh-*) 语义变量
           ============================================ */
        .xhh-main-auth {
            max-width: 28rem;
            margin-inline: auto;
            padding-inline: 1.5rem;
            padding-top: 2rem;
            padding-bottom: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        /* ---- 品牌区 ---- */
        .auth-brand { width: 100%; text-align: center; }
        .auth-brand-badge {
            width: 52px; height: 52px;
            margin-inline: auto;
            border-radius: 9999px;
            display: flex; align-items: center; justify-content: center;
            background-image: linear-gradient(135deg, var(--xhh-coral-soft), var(--xhh-coral));
            color: var(--xhh-primary-foreground);
            box-shadow: var(--xhh-shadow-button);
        }
        .auth-logo {
            margin-top: 14px;
            font-size: 40px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0.04em;
            background-image: linear-gradient(135deg, var(--xhh-coral-soft), var(--xhh-coral));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .auth-slogan {
            margin-top: 10px;
            font-size: 14px;
            color: var(--xhh-ink-2);
        }

        /* ---- 主视觉卡片 ---- */
        .auth-hero-card {
            width: 100%;
            border-radius: var(--xhh-radius-lg);
            border: 1px solid var(--xhh-border);
            background-color: var(--xhh-card);
            box-shadow: var(--xhh-shadow-card);
            overflow: hidden;
            transition: transform 0.22s cubic-bezier(0.3, 0, 0, 1), border-color 0.22s ease;
        }
        .auth-hero-card:hover {
            transform: translateY(-3px);
            border-color: color-mix(in srgb, var(--xhh-coral) 35%, transparent);
        }
        .auth-hero-img {
            display: block;
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        /* ---- 功能预览行 ---- */
        .auth-features {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }
        .auth-feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: transform 0.22s cubic-bezier(0.3, 0, 0, 1);
        }
        .auth-feature:hover { transform: translateY(-3px); }
        .auth-feature-icon {
            width: 42px; height: 42px;
            border-radius: 9999px;
            display: flex; align-items: center; justify-content: center;
            background-color: var(--xhh-coral-bg);
            color: var(--xhh-coral);
        }
        .auth-feature-label { font-size: 11px; color: var(--xhh-ink-2); }

        /* ---- 微信一键登录主按钮 ---- */
        .auth-btn-wechat {
            width: 100%;
            height: 50px;
            display: flex; align-items: center; justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 9999px;
            background-image: linear-gradient(135deg, var(--xhh-coral-soft), var(--xhh-coral));
            color: var(--xhh-primary-foreground);
            box-shadow: var(--xhh-shadow-button);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ---- 手机号登录次入口 ---- */
        .auth-btn-phone {
            display: inline-flex; align-items: center;
            gap: 4px;
            border: none;
            background: transparent;
            padding: 4px 8px;
            font-size: 13px;
            color: var(--xhh-ink-2);
            cursor: pointer;
        }

        /* ---- 隐私协议勾选行 ---- */
        .auth-agree {
            display: flex; align-items: center; justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
            width: 100%;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .auth-agree-text { font-size: 11px; color: var(--xhh-ink-3); }
        .auth-agree-link {
            font-size: 11px;
            color: var(--xhh-coral);
            text-decoration: none;
        }
        .auth-agree-link:active { opacity: 0.7; }
        .xhh-check {
            appearance: none;
            -webkit-appearance: none;
            width: 16px; height: 16px;
            margin: 0;
            flex-shrink: 0;
            border-radius: 6px;
            border: 1.5px solid var(--xhh-border);
            background-color: var(--xhh-card);
            position: relative;
            cursor: pointer;
            transition: background-color 0.16s ease, border-color 0.16s ease;
        }
        .xhh-check:checked {
            background-color: var(--xhh-coral);
            border-color: var(--xhh-coral);
        }
        .xhh-check:checked::after {
            content: '';
            position: absolute;
            left: 5px; top: 2px;
            width: 4px; height: 8px;
            border: solid var(--xhh-primary-foreground);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* ---- 按压反馈 ---- */
        .auth-press { transition: transform 0.15s ease, opacity 0.15s ease; }
        .auth-press:active { transform: scale(0.95); opacity: 0.85; }

        /* ---- 375px 窄屏防溢出 ---- */
        @media (max-width: 400px) {
            .auth-logo { font-size: 34px; }
        }

        /* ---- 减少动态效果偏好 ---- */
        @media (prefers-reduced-motion: reduce) {
            .auth-hero-card, .auth-feature, .auth-press, .xhh-check { transition: none !important; }
            .auth-hero-card:hover, .auth-feature:hover { transform: none; }
        }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>
